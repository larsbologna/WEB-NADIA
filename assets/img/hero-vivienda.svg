<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-label="Ilustración de una vivienda contemporánea integrada al paisaje serrano de Córdoba">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6DFD3"/>
      <stop offset=".55" stop-color="#F2EDE5"/>
      <stop offset="1" stop-color="#EFE8DD"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C98E6F" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#C98E6F" stop-opacity=".22"/>
      <stop offset="1" stop-color="#C98E6F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34352F"/>
      <stop offset=".6" stop-color="#22231F"/>
      <stop offset="1" stop-color="#2C2C27"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A69C8B"/>
      <stop offset="1" stop-color="#7C7466"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1EEE8"/>
      <stop offset="1" stop-color="#E2DDD4"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .13  0 0 0 0 .13  0 0 0 0 .12  0 0 0 .55 0"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#sky)"/>
  <circle cx="860" cy="560" r="300" fill="url(#sun)"/>
  <circle cx="860" cy="560" r="62" fill="#C4876A" opacity=".55"/>

  <!-- Sierras -->
  <path d="M0 860 C120 820 210 760 330 770 C430 778 470 720 560 700 C660 678 720 742 810 736 C900 730 960 668 1060 690 C1120 703 1160 735 1200 742 L1200 1500 L0 1500Z" fill="#DDD4C7"/>
  <path d="M0 930 C90 900 170 868 270 880 C370 892 420 846 520 842 C640 838 690 890 800 884 C900 878 980 836 1080 852 C1130 860 1170 878 1200 884 L1200 1500 L0 1500Z" fill="#CDC2B2"/>
  <path d="M0 1010 C140 985 260 955 400 968 C520 979 600 950 720 952 C860 954 960 990 1200 972 L1200 1500 L0 1500Z" fill="#B9AE9C"/>

  <!-- Terreno -->
  <path d="M0 1096 C260 1080 520 1088 760 1084 C940 1081 1080 1090 1200 1086 L1200 1500 L0 1500Z" fill="url(#ground)"/>

  <!-- Sombra proyectada -->
  <path d="M150 1112 L1030 1112 L860 1168 L40 1168Z" fill="#20211F" opacity=".16"/>

  <!-- Basamento de piedra -->
  <rect x="170" y="1040" width="860" height="72" fill="#8C8478"/>
  <g stroke="#6F685E" stroke-width="1.4" opacity=".7">
    <path d="M170 1064 H1030 M170 1088 H1030"/>
    <path d="M230 1040 V1064 M330 1040 V1064 M455 1040 V1064 M560 1040 V1064 M700 1040 V1064 M820 1040 V1064 M940 1040 V1064"/>
    <path d="M280 1064 V1088 M400 1064 V1088 M505 1064 V1088 M630 1064 V1088 M760 1064 V1088 M880 1064 V1088 M985 1064 V1088"/>
    <path d="M215 1088 V1112 M350 1088 V1112 M470 1088 V1112 M590 1088 V1112 M720 1088 V1112 M850 1088 V1112 M960 1088 V1112"/>
  </g>
  <rect x="170" y="1040" width="860" height="4" fill="#20211F" opacity=".25"/>

  <!-- Volumen inferior: vidriado -->
  <rect x="270" y="930" width="500" height="110" fill="url(#glass)"/>
  <g stroke="#55564F" stroke-width="2">
    <path d="M340 930 V1040 M410 930 V1040 M480 930 V1040 M550 930 V1040 M620 930 V1040 M690 930 V1040"/>
  </g>
  <path d="M300 1040 L360 930 L395 930 L335 1040Z" fill="#FFFFFF" opacity=".07"/>
  <path d="M520 1040 L580 930 L600 930 L540 1040Z" fill="#FFFFFF" opacity=".06"/>
  <!-- interior cálido -->
  <rect x="412" y="985" width="66" height="55" fill="#B77A5B" opacity=".18"/>
  <rect x="270" y="930" width="500" height="14" fill="#000" opacity=".28"/>

  <!-- Muro blanco + panel corten -->
  <rect x="770" y="930" width="110" height="110" fill="url(#wall)"/>
  <rect x="770" y="930" width="110" height="16" fill="#20211F" opacity=".12"/>
  <rect x="880" y="930" width="34" height="110" fill="#B77A5B"/>
  <g stroke="#9A6247" stroke-width="1.2"><path d="M889 930 V1040 M898 930 V1040 M907 930 V1040"/></g>

  <!-- Cochera bajo voladizo -->
  <rect x="914" y="930" width="176" height="110" fill="#5E584F" opacity=".55"/>
  <rect x="1072" y="930" width="7" height="110" fill="#20211F"/>

  <!-- Volumen superior en voladizo -->
  <rect x="430" y="818" width="660" height="112" fill="url(#wall)"/>
  <rect x="535" y="852" width="450" height="44" fill="url(#glass)"/>
  <g stroke="#55564F" stroke-width="2"><path d="M625 852 V896 M715 852 V896 M805 852 V896 M895 852 V896"/></g>
  <path d="M560 896 L585 852 L600 852 L575 896Z" fill="#fff" opacity=".08"/>
  <rect x="535" y="852" width="450" height="6" fill="#000" opacity=".25"/>
  <rect x="420" y="806" width="680" height="12" fill="#4A4A45"/>
  <rect x="430" y="818" width="660" height="5" fill="#20211F" opacity=".18"/>

  <!-- Pérgola -->
  <g fill="#3A3A36">
    <rect x="150" y="924" width="122" height="7"/>
    <rect x="156" y="931" width="5" height="109"/>
  </g>
  <g stroke="#3A3A36" stroke-width="3"><path d="M168 924 V914 M186 924 V914 M204 924 V914 M222 924 V914 M240 924 V914 M258 924 V914"/></g>
  <rect x="150" y="910" width="122" height="4" fill="#3A3A36"/>
  <path d="M160 1040 L272 940 L272 1040Z" fill="#20211F" opacity=".06"/>

  <!-- Algarrobo -->
  <path d="M118 1100 C122 1040 112 990 96 950 C90 934 100 930 106 944 C118 970 128 990 134 1010 C142 980 162 958 186 946 C196 941 198 950 190 956 C164 974 148 1004 142 1040 C140 1062 140 1084 142 1100Z" fill="#45443D"/>
  <g fill="#62645A">
    <ellipse cx="78" cy="922" rx="86" ry="40"/>
    <ellipse cx="160" cy="900" rx="96" ry="44"/>
    <ellipse cx="230" cy="930" rx="70" ry="30"/>
    <ellipse cx="110" cy="876" rx="70" ry="32"/>
  </g>
  <g fill="#73766A" opacity=".9">
    <ellipse cx="146" cy="884" rx="58" ry="20"/>
    <ellipse cx="62" cy="910" rx="44" ry="16"/>
    <ellipse cx="226" cy="918" rx="40" ry="14"/>
  </g>

  <!-- Arbustos y pastos -->
  <g fill="#6A6B5F">
    <ellipse cx="1100" cy="1094" rx="70" ry="26"/>
    <ellipse cx="1160" cy="1086" rx="54" ry="30"/>
    <ellipse cx="300" cy="1108" rx="46" ry="12"/>
  </g>
  <g stroke="#5E5F53" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M40 1220 l6 -40 M52 1222 l-4 -46 M64 1220 l10 -38 M78 1222 l-2 -34"/>
    <path d="M1080 1240 l6 -40 M1092 1242 l-4 -46 M1104 1240 l10 -38 M1118 1242 l-2 -34 M1132 1240 l8 -30"/>
    <path d="M620 1300 l4 -30 M630 1302 l-3 -34 M640 1300 l7 -28"/>
  </g>
  <path d="M0 1260 C300 1240 700 1250 1200 1236 L1200 1500 L0 1500Z" fill="#6F685C" opacity=".35"/>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".32"/>
</svg>
